<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Whiteboard</title>
  <meta name="theme-color" content="#0d1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@300;400;500;600&family=Patrick+Hand&family=Indie+Flower&family=Kalam&family=Permanent+Marker&family=Dancing+Script&family=Gloria+Hallelujah&family=Orbitron&family=Exo+2&family=Rajdhani&family=Share+Tech&family=JetBrains+Mono&family=Space+Mono&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="name-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Who are you?</h2>
      <div id="name-options"></div>
    </div>
  </div>

  <header>
    <h1>Family Whiteboard<span class="header-tagline">shared space</span></h1>
    <div class="user-info">
      <span id="user-greeting"></span>
      <button id="admin-btn" class="hidden">Admin</button>
      <button id="switch-btn">Switch</button>
    </div>
  </header>

  <main>
    <section class="add-note">
      <textarea id="new-note-input" placeholder="Write a note..." rows="3"></textarea>
      <button id="add-btn">Add Note</button>
    </section>

    <section id="notes-list"></section>
  </main>

  <div id="admin-modal" class="modal-overlay hidden">
    <div class="modal modal--admin">
      <div class="admin-modal-header">
        <h2>Admin Panel</h2>
        <button id="admin-close-btn" class="admin-close">&#x2715;</button>
      </div>

      <div class="admin-section">
        <h3>Clear Whiteboard</h3>
        <p>Permanently removes all notes for everyone. Cannot be undone.</p>
        <button id="clear-board-btn">Clear All Notes</button>
      </div>

      <div class="admin-section">
        <h3>Note Font</h3>
        <div id="font-options"></div>
      </div>

      <div class="admin-section">
        <h3>Note Shape</h3>
        <div id="style-options"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
